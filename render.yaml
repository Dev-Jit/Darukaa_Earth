# Render Blueprint — backend web service + managed PostgreSQL.
# Apply from the Render Dashboard: New → Blueprint → this repo.
# After the database is up, enable PostGIS (see PROGRESS.md) if Alembic has not run yet.

services:
  - type: web
    name: darukaa-earth-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-earth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

databases:
  - name: darukaa-earth-db
    databaseName: daruka_earth
    user: daruka
    plan: free
    postgresMajorVersion: "16"
    region: oregon
